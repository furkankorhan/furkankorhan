<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/>
      <stop offset="0.58" stop-color="#081524"/>
      <stop offset="1" stop-color="#112F3B"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(910 275) rotate(150) scale(430 255)">
      <stop stop-color="#E86F2A" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#E86F2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 112) rotate(150) scale(320 210)">
      <stop stop-color="#5EDAE8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#5EDAE8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#E86F2A"/>
      <stop offset="1" stop-color="#5EDAE8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D69A73"/>
      <stop offset="0.55" stop-color="#B87458"/>
      <stop offset="1" stop-color="#8F4F3E"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1280" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="portraitShadow" x="680" y="22" width="520" height="430" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="1244" height="384" rx="34" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="18" y="18" width="1244" height="384" rx="34" fill="url(#orangeGlow)"/>
  <rect x="18" y="18" width="1244" height="384" rx="34" fill="url(#blueGlow)"/>
  <rect x="18.5" y="18.5" width="1243" height="383" rx="33.5" stroke="white" stroke-opacity="0.08"/>

  <path d="M72 320H594" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <text x="72" y="128" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Merhaba, ben Furkan.</text>
  <text x="76" y="178" fill="#F7B06A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Informatik yolumu açık şekilde inşa ediyorum.</text>
  <text x="76" y="226" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">IT systems, web basics, troubleshooting and Ausbildung preparation.</text>
  <text x="76" y="260" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Hildesheim, Germany | IT Ausbildung 2026</text>

  <rect x="76" y="346" width="144" height="34" rx="17" fill="#111827" stroke="#E86F2A" stroke-opacity="0.52"/>
