  <rect x="232" y="346" width="112" height="34" rx="17" fill="#111827" stroke="#5EDAE8" stroke-opacity="0.52"/>
  <text x="268" y="368" fill="#D6FBFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Web</text>
  <rect x="356" y="346" width="178" height="34" rx="17" fill="#111827" stroke="white" stroke-opacity="0.16"/>
  <text x="394" y="368" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Build log</text>

